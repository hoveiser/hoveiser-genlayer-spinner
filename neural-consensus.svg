<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Loading — GenLayer">
  <defs>
    <linearGradient id="nc-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E37DF7"/>
      <stop offset=".45" stop-color="#9B6AF6"/>
      <stop offset="1" stop-color="#110FFF"/>
    </linearGradient>
  </defs>
  <style>
    .nc-ring{fill:none;stroke:#6B6B6B;stroke-opacity:.35;stroke-width:1}
    .nc-idle{fill:#6B6B6B}
    .nc-glow{fill:url(#nc-grad);opacity:0;animation:nc-chase 1.6s cubic-bezier(.4,0,.2,1) infinite}
    .nc-core{fill:url(#nc-grad);animation:nc-core 1.6s ease-in-out infinite}
    .n1{animation-delay:0s}.n2{animation-delay:.2s}.n3{animation-delay:.4s}.n4{animation-delay:.6s}
    .n5{animation-delay:.8s}.n6{animation-delay:1s}.n7{animation-delay:1.2s}.n8{animation-delay:1.4s}
    @keyframes nc-chase{0%,45%,100%{opacity:0}12%,30%{opacity:1}}
    @keyframes nc-core{0%,100%{opacity:.6}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.nc-glow,.nc-core{animation:none}.nc-glow{opacity:.85}}
  </style>
  <circle class="nc-ring" cx="32" cy="32" r="24"/>
  <circle class="nc-idle" cx="32" cy="8" r="4.5"/><circle class="nc-idle" cx="49" cy="15" r="4.5"/>
  <circle class="nc-idle" cx="56" cy="32" r="4.5"/><circle class="nc-idle" cx="49" cy="49" r="4.5"/>
  <circle class="nc-idle" cx="32" cy="56" r="4.5"/><circle class="nc-idle" cx="15" cy="49" r="4.5"/>
  <circle class="nc-idle" cx="8" cy="32" r="4.5"/><circle class="nc-idle" cx="15" cy="15" r="4.5"/>
  <circle class="nc-glow n1" cx="32" cy="8" r="4.5"/><circle class="nc-glow n2" cx="49" cy="15" r="4.5"/>
  <circle class="nc-glow n3" cx="56" cy="32" r="4.5"/><circle class="nc-glow n4" cx="49" cy="49" r="4.5"/>
  <circle class="nc-glow n5" cx="32" cy="56" r="4.5"/><circle class="nc-glow n6" cx="15" cy="49" r="4.5"/>
  <circle class="nc-glow n7" cx="8" cy="32" r="4.5"/><circle class="nc-glow n8" cx="15" cy="15" r="4.5"/>
  <circle class="nc-core" cx="32" cy="32" r="4"/>
</svg>