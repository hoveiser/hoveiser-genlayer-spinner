<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Loading — GenLayer">
  <style>
    .nc-ring{fill:none;stroke:#606060;stroke-opacity:.3;stroke-width:1}
    .nc-node{fill:#606060;animation:nc-chase 1.6s cubic-bezier(.4,0,.2,1) infinite}
    .nc-core{fill:#110FFF;transform-box:fill-box;transform-origin:center;animation:nc-core 1.6s ease-in-out infinite}
    .n1{animation-delay:0s}.n2{animation-delay:.2s}.n3{animation-delay:.4s}.n4{animation-delay:.6s}
    .n5{animation-delay:.8s}.n6{animation-delay:1s}.n7{animation-delay:1.2s}.n8{animation-delay:1.4s}
    @keyframes nc-chase{0%,45%,100%{fill:#606060}12%,30%{fill:#110FFF}}
    @keyframes nc-core{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
    @media (prefers-reduced-motion:reduce){.nc-node,.nc-core{animation:none}.nc-node{fill:#110FFF;opacity:.7}}
  </style>
  <circle class="nc-ring" cx="32" cy="32" r="24"/>
  <circle class="nc-node n1" cx="32" cy="8"  r="4.5"/>
  <circle class="nc-node n2" cx="49" cy="15" r="4.5"/>
  <circle class="nc-node n3" cx="56" cy="32" r="4.5"/>
  <circle class="nc-node n4" cx="49" cy="49" r="4.5"/>
  <circle class="nc-node n5" cx="32" cy="56" r="4.5"/>
  <circle class="nc-node n6" cx="15" cy="49" r="4.5"/>
  <circle class="nc-node n7" cx="8"  cy="32" r="4.5"/>
  <circle class="nc-node n8" cx="15" cy="15" r="4.5"/>
  <circle class="nc-core" cx="32" cy="32" r="4"/>
</svg>