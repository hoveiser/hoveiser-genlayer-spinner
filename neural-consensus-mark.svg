  <circle class="ncm-idle" cx="8" cy="32" r="4.5"/><circle class="ncm-idle" cx="15" cy="15" r="4.5"/>
  <circle class="ncm-glow m1" cx="32" cy="8" r="4.5"/><circle class="ncm-glow m2" cx="49" cy="15" r="4.5"/>
  <circle class="ncm-glow m3" cx="56" cy="32" r="4.5"/><circle class="ncm-glow m4" cx="49" cy="49" r="4.5"/>
  <circle class="ncm-glow m5" cx="32" cy="56" r="4.5"/><circle class="ncm-glow m6" cx="15" cy="49" r="4.5"/>
  <circle class="ncm-glow m7" cx="8" cy="32" r="4.5"/><circle class="ncm-glow m8" cx="15" cy="15" r="4.5"/>

  <!-- tinted container (brand pattern) -->
