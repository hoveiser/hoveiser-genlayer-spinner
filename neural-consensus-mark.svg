<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Loading — GenLayer">
  <defs>
    <linearGradient id="ncm-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E37DF7"/>
      <stop offset=".45" stop-color="#9B6AF6"/>
      <stop offset="1" stop-color="#110FFF"/>
    </linearGradient>
  </defs>
  <style>
    .ncm-ring{fill:none;stroke:#6B6B6B;stroke-opacity:.35;stroke-width:1}
    .ncm-idle{fill:#6B6B6B}
    .ncm-glow{fill:url(#ncm-grad);opacity:0;animation:ncm-chase 1.6s cubic-bezier(.4,0,.2,1) infinite}
    .m1{animation-delay:0s}.m2{animation-delay:.2s}.m3{animation-delay:.4s}.m4{animation-delay:.6s}
    .m5{animation-delay:.8s}.m6{animation-delay:1s}.m7{animation-delay:1.2s}.m8{animation-delay:1.4s}
    @keyframes ncm-chase{0%,45%,100%{opacity:0}12%,30%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.ncm-glow{animation:none;opacity:.85}}
  </style>
